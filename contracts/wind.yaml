openapi: "3.1.0"
info:
  title: Wind Analysis Service
  version: "2.0.0"
  description: >
    Wind analysis from live data — Open-Meteo Archive (ERA5 reanalysis, 10 m wind,
    5-year daily): mean/max speed, gust risk, prevailing direction (8-point), India
    seasonal breakdown, comfort + building-impact scoring. Raises on no upstream data.

servers:
  - url: http://localhost:8003
    description: Local dev

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "wind"

  /wind/analyze:
    post:
      operationId: analyzeWind
      summary: Wind analysis for a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WindRequest"
      responses:
        "200":
          description: Wind analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindAnalysis"
        "403":
          description: Feature flag disabled
        "422":
          description: Validation error

components:
  schemas:
    WindRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        radius_meters:
          type: number
          format: float
          default: 1000

    Orientation:
      type: string
      enum: [North, Northeast, East, Southeast, South, Southwest, West, Northwest]

    ComfortLevel:
      type: string
      enum: [Poor, Fair, Good, Excellent]

    WindLoadRisk:
      type: string
      enum: [Low, Moderate, High, "Very High"]

    DirectionDistribution:
      type: object
      description: >-
        Percentage frequency of the dominant daily wind direction, binned to the
        8-point compass. Keys are the Orientation enum; values sum to ~100.
      additionalProperties:
        type: number
        format: float
        minimum: 0
        maximum: 100

    SeasonData:
      type: object
      description: >-
        One India-meteorological season, pooled across every year in the analysis
        window (5 years), not a single occurrence of that season.
      required:
        [
          average_wind_speed,
          max_wind_speed,
          prevailing_direction,
          direction_distribution,
          gust_risk,
          recommended_orientation,
        ]
      properties:
        average_wind_speed:
          type: number
          format: float
        max_wind_speed:
          type: number
          format: float
        prevailing_direction:
          $ref: "#/components/schemas/Orientation"
        direction_distribution:
          $ref: "#/components/schemas/DirectionDistribution"
        gust_risk:
          type: string
        recommended_orientation:
          $ref: "#/components/schemas/Orientation"

    SeasonalAnalysis:
      type: object
      required: [summer, monsoon, winter]
      properties:
        summer:
          $ref: "#/components/schemas/SeasonData"
        monsoon:
          $ref: "#/components/schemas/SeasonData"
        winter:
          $ref: "#/components/schemas/SeasonData"

    ComfortAnalysis:
      type: object
      required: [pedestrian_comfort, natural_ventilation_potential, outdoor_usability]
      properties:
        pedestrian_comfort:
          $ref: "#/components/schemas/ComfortLevel"
        natural_ventilation_potential:
          $ref: "#/components/schemas/ComfortLevel"
        outdoor_usability:
          $ref: "#/components/schemas/ComfortLevel"

    BuildingImpact:
      type: object
      required: [wind_load_risk, recommended_orientation]
      properties:
        wind_load_risk:
          $ref: "#/components/schemas/WindLoadRisk"
        recommended_orientation:
          $ref: "#/components/schemas/Orientation"

    WindMetadata:
      type: object
      required: [latitude, longitude, radius_meters, data_source]
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        radius_meters:
          type: number
          format: float
        data_source:
          type: string

    WindAnalysis:
      type: object
      required:
        [
          average_wind_speed,
          max_wind_speed,
          prevailing_direction,
          direction_distribution,
          wind_category,
          gust_risk,
          seasonal_analysis,
          comfort_analysis,
          building_impact,
          recommendations,
          metadata,
        ]
      properties:
        average_wind_speed:
          type: number
          format: float
        max_wind_speed:
          type: number
          format: float
        prevailing_direction:
          $ref: "#/components/schemas/Orientation"
        direction_distribution:
          $ref: "#/components/schemas/DirectionDistribution"
        wind_category:
          type: string
        gust_risk:
          type: string
        seasonal_analysis:
          $ref: "#/components/schemas/SeasonalAnalysis"
        comfort_analysis:
          $ref: "#/components/schemas/ComfortAnalysis"
        building_impact:
          $ref: "#/components/schemas/BuildingImpact"
        recommendations:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/WindMetadata"
