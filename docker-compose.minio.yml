version: "3"
services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-test-data:/data

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb localminio/cyclone-wind-grids;
      /usr/bin/mc anonymous set public localminio/cyclone-wind-grids;
      exit 0;
      "